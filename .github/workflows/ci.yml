name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-expense
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_expense
          POSTGRES_USER: smart_expense
          POSTGRES_PASSWORD: ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U smart_expense" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production-012345678901234567890
      DB_ENGINE: postgres
      DB_NAME: smart_expense
      DB_USER: smart_expense
      DB_PASSWORD: ci-password
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: smart-expense/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: bandit -r accounts categories transactions budgets dashboard reports audit config -x '*/tests/*' -ll
      - run: pip-audit -r requirements.txt
      - run: pytest --cov-fail-under=70
      - name: SonarQube scan and quality gate
        if: vars.SONAR_PROJECT_KEY != '' && vars.SONAR_HOST_URL != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: smart-expense
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            ${{ vars.SONAR_ORGANIZATION != '' && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: |
            smart-expense/coverage.xml
            smart-expense/test-results.xml
