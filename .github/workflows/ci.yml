
name: Smart Expense CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-expense-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint, security and test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: smart-expense

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_expense
          POSTGRES_USER: smart_expense
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U smart_expense -d smart_expense"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production-012345678901234567890
      DJANGO_DEBUG: "false"
      DB_ENGINE: postgres
      DB_NAME: smart_expense
      DB_USER: smart_expense
      DB_PASSWORD: ci-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            smart-expense/requirements.txt
            smart-expense/requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Run Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply database migrations
        run: python manage.py migrate --noinput

      - name: Run Bandit security analysis
        run: bandit -r accounts categories transactions budgets dashboard reports audit config -x '*/tests/*' -ll

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Run tests with branch coverage
        run: pytest --cov-fail-under=70

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-expense-validation-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            smart-expense/coverage.xml
            smart-expense/test-results.xml
