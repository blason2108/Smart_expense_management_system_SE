<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Smart Expense{% endblock %}</title></head>
<body>
<nav>{% if user.is_authenticated %}<a href="{% url 'dashboard:home' %}">Dashboard</a>
<form method="post" action="{% url 'accounts:logout' %}" style="display:inline">{% csrf_token %}<button>Logout</button></form>
{% else %}<a href="{% url 'accounts:login' %}">Login</a>{% endif %}</nav>
{% for m in messages %}<p role="alert">{{ m }}</p>{% endfor %}
{% block content %}{% endblock %}
</body></html>
