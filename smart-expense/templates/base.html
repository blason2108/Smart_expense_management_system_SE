<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Smart Expense{% endblock %}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#183044;font:16px/1.5 system-ui,sans-serif}nav{background:#142f43;color:white;padding:18px 4%;display:flex;gap:18px;align-items:center;flex-wrap:wrap}nav a{color:white}nav strong{margin-right:auto}main{max-width:1100px;margin:32px auto;padding:0 22px}a{color:#006a76}h1{font-size:30px;letter-spacing:-1px}h2{font-size:21px}.card,form.panel{background:white;border:1px solid #dce4ec;border-radius:12px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.number{font-size:30px;font-weight:700}button,.button{background:#006a76;color:white;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}input,select{padding:10px;max-width:100%;border:1px solid #aab9c7;border-radius:5px;font:inherit}label{display:block;font-weight:600}form p{margin:14px 0}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #dde5ed}.scroll{overflow:auto}small,.helptext{color:#516879}.errorlist,[role=alert]{color:#9f2231}.badge{font-weight:700}nav form{margin:0}.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.filters p{max-width:220px}.muted{color:#516879}
</style></head><body><nav><strong>Smart Expense</strong>{% if user.is_authenticated %}
<a href="{% url 'dashboard:home' %}">Dashboard</a><a href="{% url 'categories:list' %}">Categories</a><a href="{% url 'transactions:list' %}">Transactions</a><a href="{% url 'budgets:list' %}">Budgets</a><a href="{% url 'reports:list' %}">Reports & analytics</a>{% if user.is_staff %}<a href="/django-admin/">Admin</a>{% endif %}
<form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button>Logout</button></form>{% else %}<a href="{% url 'accounts:login' %}">Login</a><a href="{% url 'accounts:register' %}">Register</a>{% endif %}</nav><main>
{% for m in messages %}<p role="alert">{{ m }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
