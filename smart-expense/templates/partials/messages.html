{# Flash messages. Django levels -> CSS: success, error, warning, info (debug falls back to info). #}
{% if messages %}
<div class="messages">
  {% for message in messages %}
    <div class="alert alert-{% if message.level_tag == 'debug' %}info{% else %}{{ message.level_tag }}{% endif %}" role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}
