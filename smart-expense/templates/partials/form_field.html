{# One field: label, widget, help text, inline errors. Usage: {% include "partials/form_field.html" with field=form.username %} #}
<div class="form-field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<span class="field-help" id="{{ field.id_for_label }}_help">{{ field.help_text }}</span>{% endif %}
  {% for error in field.errors %}<span class="field-error" id="{{ field.id_for_label }}_error{{ forloop.counter }}" role="alert">{{ error }}</span>{% endfor %}
</div>
