{# Navigation (SEB-NF-003). To add a page, add one <a> below; mark active via request.resolver_match.app_name. #}
{% with current=request.resolver_match.app_name %}
<nav class="navbar" aria-label="Main navigation">
  <div class="container">
    <a class="brand" href="{% url 'dashboard:home' %}">Smart Expense</a>
    {% if user.is_authenticated %}
      <a class="nav-link{% if current == 'dashboard' %} active{% endif %}" href="{% url 'dashboard:home' %}"{% if current == 'dashboard' %} aria-current="page"{% endif %}>Dashboard</a>
      <span class="nav-user">{{ user.get_username }}</span>
      <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit">Logout</button></form>
    {% else %}
      <a class="nav-link{% if current == 'accounts' %} active{% endif %}" href="{% url 'accounts:login' %}"{% if current == 'accounts' %} aria-current="page"{% endif %}>Login</a>
    {% endif %}
  </div>
</nav>
{% endwith %}
