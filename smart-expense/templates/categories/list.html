{% extends 'base.html' %}{% block content %}<h1>Your categories</h1><a class="button" href="{% url 'categories:new' %}">New category</a><div class="scroll card"><table><tr><th>Name</th><th>Type</th><th>Actions</th></tr>{% for i in items %}<tr><td>{{ i.name }}</td><td>{{ i.get_kind_display }}</td><td><a href="{% url 'categories:edit' i.pk %}">Edit</a> / <a href="{% url 'categories:delete' i.pk %}">Delete</a></td></tr>{% empty %}<tr><td colspan="3">Create an income and an expense category to get started.</td></tr>{% endfor %}</table></div>{% endblock %}
